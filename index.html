<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00658c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Diamonds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diamonds — Juego casual de combinar diamantes</title>
<meta name="description" content="Juego casual de combinar diamantes: mapa de mundos y niveles procedurales, dificultad creciente, diamantes duros y poderes especiales. Funciona sin conexión." />
<link rel="canonical" href="https://diamonds.dotrino.com/" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="es_ES" />
<meta property="og:site_name" content="Dotrino" />
<meta property="og:title" content="Diamonds" />
<meta property="og:description" content="Combina diamantes por mundos y niveles procedurales: diamantes duros, poderes especiales y combos." />
<meta property="og:url" content="https://diamonds.dotrino.com/" />
<meta property="og:image" content="https://diamonds.dotrino.com/og.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Diamonds" />
<meta name="twitter:description" content="Combina diamantes por mundos y niveles procedurales: diamantes duros, poderes especiales y combos." />
<meta name="twitter:image" content="https://diamonds.dotrino.com/og.jpg" />
<!-- Analítica cookieless autohosteada (GoatCounter); no cuenta en localhost/LAN. -->
<script>window.goatcounter={path:function(p){return location.hostname+p}}</script>
<script data-goatcounter="https://goat.dotrino.com/count" async src="https://goat.dotrino.com/count.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Diamonds",
  "url": "https://diamonds.dotrino.com/",
  "description": "Juego casual de combinar diamantes con mapa de mundos y niveles procedurales, diamantes duros y poderes especiales.",
  "applicationCategory": "GameApplication",
  "operatingSystem": "Web",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "publisher": { "@type": "Organization", "name": "Dotrino", "url": "https://dotrino.com/" }
}
</script>
</head>
<body>

  <!-- Barra superior ESTÁNDAR del ecosistema (§5): marca + volver + idioma +
       perfil (§6.1) + moneda de support, todo en un componente. La app solo pasa
       lo suyo por slot: la acción "← Mapa" y el botón de instalar. -->
  <dotrino-topbar
    brand="Diamonds"
    icon="icon.svg"
    brand-href="./"
    profile theme
    support-href="https://ko-fi.com/dotrino"
    support-repo="imdotrino/dotrino-diamonds"
    support-discord="https://discord.gg/D648uq7cth">
    <button id="btnMapTop" class="topbar-action" style="display:none">← Mapa</button>
    <dotrino-install slot="end" class="cc-install"></dotrino-install>
  </dotrino-topbar>

  <!-- ============ VISTA MAPA ============ -->
  <div class="view active" id="mapView">
    <div class="map-vp" id="mapViewport">
      <div id="mapWorld">
        <svg id="mapSvg"></svg>
      </div>
    </div>
    <div class="map-hud" id="mapHud"></div>
    <div class="map-hint" id="mapHint">Arrastra para explorar el mapa</div>
    <button class="map-recenter" id="mapRecenter">◎ Nivel actual</button>
    <button class="map-book" id="btnGlossary" aria-label="Guía">📖<span id="bookTxt">Guía</span></button>
  </div>

  <!-- ============ VISTA JUEGO ============ -->
  <div class="view" id="gameView">
    <div class="scores">
      <div class="score">
        <div class="lbl" id="lblLevel">Nivel</div>
        <div class="val" id="hudLevel">1·1</div>
      </div>
      <div class="score obj">
        <div class="lbl" id="objLbl">Objetivo</div>
        <div class="val" id="objVal">—</div>
      </div>
      <div class="score">
        <div class="lbl" id="lblMoves">Mov.</div>
        <div class="val" id="moves">30</div>
      </div>
      <div class="score">
        <div class="lbl" id="lblPoints">Puntos</div>
        <div class="val" id="score">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <canvas id="board"></canvas>
    </div>

    <div class="control">
      <button id="btnMap2">← Mapa</button>
    </div>
  </div>

  <!-- ============ GLOSARIO ============ -->
  <div class="modal gloss" id="modalGlossary">
    <div class="gloss-box">
      <div class="gloss-head">
        <h2 id="glossaryTitle">Guía del juego</h2>
        <button class="gloss-close" id="btnGlossaryClose">✕</button>
      </div>
      <div class="gloss-body" id="glossaryBody"></div>
    </div>
  </div>

  <div class="combo" id="combo"></div>

  <div class="modal" id="endModal">
    <div class="modal-box">
      <h2 id="endTitle">¡Nivel superado!</h2>
      <div class="stars" id="endStars"></div>
      <p id="endMsg"></p>
      <div class="modal-buttons">
        <button id="btnNext">Siguiente nivel</button>
        <button id="btnRetry">Reintentar</button>
        <button class="sec" id="btnShare">Compartir</button>
        <button class="sec" id="btnEndless">∞ Seguir sin límite</button>
        <button class="sec" id="btnMapModal">Ir al mapa</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
